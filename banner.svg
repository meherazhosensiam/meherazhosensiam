<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
  <stop stop-color="#05070B"/>
  <stop offset="0.55" stop-color="#080D15"/>
  <stop offset="1" stop-color="#07141A"/>
</linearGradient>

<!-- Accent -->
<linearGradient id="accent" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse">
  <stop stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#22D3EE"/>
  <stop offset="1" stop-color="#14B8A6"/>
</linearGradient>

<!-- Soft glow -->
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Stronger glow -->
<filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="14" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Grid -->
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
  <path d="M 50 0 L 0 0 0 50"
        stroke="#38BDF8"
        stroke-opacity="0.045"
        stroke-width="1"/>
</pattern>

<!-- Fade -->
<linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#05070B" stop-opacity="0"/>
  <stop offset="1" stop-color="#05070B" stop-opacity="0.95"/>
</linearGradient>
```

  </defs>

